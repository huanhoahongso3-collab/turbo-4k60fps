name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.1

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret: building with the throwaway debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK and show signer
        run: |
          cp app/build/outputs/apk/release/app-release.apk Turbo4K.apk
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs Turbo4K.apk 2>&1 | grep -E "certificate (DN|SHA-256)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Turbo4K-${{ github.run_number }}
          path: Turbo4K.apk

      # Every push to main replaces the "dev" pre-release with the newest build.
      - name: Publish dev build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev Turbo4K.apk \
            --title "Dev build ${{ github.run_number }}" \
            --notes "Latest development build from ${{ github.sha }}. May be unstable." \
            --target ${{ github.sha }} \
            --prerelease

      # Pushing a tag like v1.0 publishes a proper release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Turbo4K.apk \
            --title "Turbo4K ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
